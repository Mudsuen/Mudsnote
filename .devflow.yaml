schema_version: 2
workflow_version: 2
automation:
  pull_request: ready
  merge: event-driven
  merge_method: squash
  legacy_pull_requests: manual
  control_plane: hold
  full_verification: merge-candidate-once
  post_merge_verification: platform-pr-smoke
agent_interface:
  context: ./scripts/agent_context.sh --task
  results: json
  delivery_wait: devtask wait
  documentation: on-error-or-process-change
logging:
  success: summary-only
  failure_tail_lines: 24
  failure_first_actionable_error: true
iteration_modes:
  ui-tuning: one-task-one-branch-one-pr
post_merge_full_verification_reasons:
  - base-changed-after-candidate
  - merge-queue-created-new-candidate
  - migration
  - signing-or-release
  - explicit-risk-review
verification:
  pr: ./scripts/verify pr
  full: ./scripts/verify full
  live: ./scripts/verify live
data_policy:
  production_ci: forbidden
  credentials_ci: forbidden
platforms:
  macos:
    pr: ./scripts/verify macos pr
    full: ./scripts/verify macos full
    live: ./scripts/verify macos live
  ios:
    pr: ./scripts/verify ios pr
    full: ./scripts/verify ios full
    live: ./scripts/verify ios live
  both:
    pr: ./scripts/verify both pr
    full: ./scripts/verify both full
    live: ./scripts/verify both live
hard_stops:
  - irreversible-data
  - production-release
  - signing-or-secret
  - guardrail-weakening
control_plane:
  - .github/workflows/**
  - .devflow.yaml
  - scripts/verify*
  - scripts/package*
  - scripts/device_smoke.sh
  - '**/*.entitlements'
