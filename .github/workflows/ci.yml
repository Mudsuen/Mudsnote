name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check repository boundary
        shell: bash
        run: |
          test -f AGENTS.md
          test -x scripts/verify
          grep -qx '/.task' .gitignore
          if git ls-files | grep -E '(^|/)(\.env($|\.)|[^/]+\.(sqlite|sqlite3|db|pem|p8|p12|key|mobileprovision)$|\.netrc$|id_rsa$|id_ed25519$)'; then
            echo 'Tracked credential or database-like files violate the CI boundary.' >&2
            exit 1
          fi
      - name: Test platform routing
        run: bash scripts/test_verify_ios_destination.sh

  verify:
    name: verification
    needs: policy
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: Verify main
        env:
          MUDSNOTE_DIFF_BASE: ${{ github.event.before }}
          MUDSNOTE_DIFF_HEAD: ${{ github.sha }}
        run: ./scripts/verify full
