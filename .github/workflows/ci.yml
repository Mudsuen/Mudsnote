name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:
    inputs:
      devflow_post_merge:
        description: Run the lightweight post-merge verification contract
        required: false
        type: boolean
        default: false
      devflow_platform:
        description: Platform recorded in the merged Devflow manifest
        required: false
        type: choice
        options:
          - none
          - macos
          - ios
          - both
        default: none
      devflow_full_reason:
        description: Explicit reason for another full verification after the merge candidate
        required: false
        type: choice
        options:
          - none
          - base-changed-after-candidate
          - merge-queue-created-new-candidate
          - migration
          - signing-or-release
          - explicit-risk-review
        default: none
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check delivery policy
        shell: bash
        run: |
          test -f AGENTS.md
          test -f .devflow.yaml
          test -f .github/workflows/auto-merge.yml
          test -x scripts/verify
          grep -q '^schema_version: 2$' .devflow.yaml
          grep -q '^workflow_version: 2$' .devflow.yaml
          grep -qx '/.task' .gitignore
          if git ls-files | grep -E '(^|/)(\.env($|\.)|[^/]+\.(sqlite|sqlite3|db|pem|p8|p12|key|mobileprovision)$|\.netrc$|id_rsa$|id_ed25519$)'; then
            echo 'Tracked credential or database-like files violate the PR CI boundary.' >&2
            exit 1
          fi

  scope:
    name: verification-scope
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.contract.outputs.platform }}
      mode: ${{ steps.contract.outputs.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - id: contract
        name: Select platform and verification tier
        shell: bash
        env:
          DEVFLOW_PLATFORM: ${{ inputs.devflow_platform }}
          DEVFLOW_FULL_REASON: ${{ inputs.devflow_full_reason }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            platform="$(./scripts/detect_platform_scope.sh)"
            if [[ "$PR_DRAFT" == true ]]; then
              mode=pr
            else
              mode=full
            fi
          elif [[ "$DEVFLOW_FULL_REASON" != "" && "$DEVFLOW_FULL_REASON" != none ]]; then
            platform="${DEVFLOW_PLATFORM:-none}"
            mode=full
          else
            platform="${DEVFLOW_PLATFORM:-none}"
            mode=pr
          fi
          echo "platform=$platform" >>"$GITHUB_OUTPUT"
          echo "mode=$mode" >>"$GITHUB_OUTPUT"

  macos-verify:
    name: macOS verification
    needs: scope
    if: needs.scope.outputs.platform == 'macos' || needs.scope.outputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: Fetch current integration base
        run: git fetch origin main
      - name: Verify
        run: ./scripts/verify macos "${{ needs.scope.outputs.mode }}"

  ios-verify:
    name: iOS verification
    needs: scope
    if: needs.scope.outputs.platform == 'ios' || needs.scope.outputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: Fetch current integration base
        run: git fetch origin main
      - name: Verify
        env:
          IOS_VERIFY_PARALLEL_FULL: 1
        run: ./scripts/verify ios "${{ needs.scope.outputs.mode }}"

  verification-result:
    name: ${{ needs.scope.outputs.mode == 'full' && 'build-and-test' || 'iteration-check' }}
    needs:
      - scope
      - macos-verify
      - ios-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected verification lane
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MACOS_RESULT: ${{ needs.macos-verify.result }}
          IOS_RESULT: ${{ needs.ios-verify.result }}
        run: |
          test "$SCOPE_RESULT" = success
          for result in "$MACOS_RESULT" "$IOS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  merge-candidate:
    name: merge-candidate
    needs:
      - scope
      - verification-result
    if: >-
      needs.scope.outputs.mode == 'full' &&
      needs.verification-result.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Full merge-candidate verification passed."
