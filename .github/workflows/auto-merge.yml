name: Devflow Auto Merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: devflow-auto-merge-${{ github.event.workflow_run.repository.id }}-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge eligible verified change
        shell: bash
        run: |
          set -euo pipefail

          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          mapfile -t candidate_conclusions < <(
            gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name == "merge-candidate") | .conclusion'
          )
          if [[ "${#candidate_conclusions[@]}" != 1 || "${candidate_conclusions[0]}" != success ]]; then
            echo 'This run has no unique successful merge-candidate attestation.'
            exit 0
          fi

          pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"$run_json")"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/commits/$TESTED_HEAD_SHA/pulls" \
                --jq 'map(select(.state == "open" and .base.ref == "main"))[0].number // empty'
            )"
          fi
          if [[ -z "$pr_number" ]]; then
            echo 'No open main pull request is associated with this verified commit.'
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          body="$(jq -r '.body // ""' <<<"$pr_json")"

          if [[ "$state" != open || "$draft" != false || "$base_ref" != main ]]; then
            echo 'PR is closed, Draft, or not targeting main; no automatic merge.'
            exit 0
          fi
          if [[ "$head_repo" != "$REPOSITORY" || "$head_ref" != codex/* ]]; then
            echo 'Only same-repository codex/* branches are eligible.'
            exit 0
          fi
          if [[ "$head_sha" != "$TESTED_HEAD_SHA" ]]; then
            echo 'PR head changed after this CI run; the newer run owns the decision.'
            exit 0
          fi

          manifest="$(
            BODY="$body" python3 - <<'PY'
          import os
          import re

          match = re.search(r"<!-- devflow-manifest: (\{[^\n]+\}) -->", os.environ["BODY"])
          print(match.group(1) if match else "")
          PY
          )"
          if [[ -z "$manifest" ]]; then
            echo 'No Devflow v2 manifest; legacy PR remains manual.'
            exit 0
          fi
          if ! jq -e \
            '.schema_version == 2 and
             .workflow_version == 2 and
             .merge_policy == "auto" and
             .hard_stop == "none" and
             .data_policy.production_read == false and
             .data_policy.production_write == "forbidden"' \
            >/dev/null <<<"$manifest"; then
            echo 'Manifest requires a merge hold.'
            exit 0
          fi
          post_merge_platform="$(jq -r '.platform // "none"' <<<"$manifest")"
          case "$post_merge_platform" in
            none|macos|ios|both) ;;
            *) echo 'Manifest has an invalid platform; no automatic merge.'; exit 0 ;;
          esac

          changed_files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files" --jq '.[].filename')"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.devflow.yaml|bin/devtask|scripts/verify*|scripts/detect_platform_scope.sh|scripts/agent_context.sh|scripts/test_verify_ios_destination.sh|scripts/validate_ios_app_store_metadata.py|scripts/device_smoke.sh|scripts/ios_signing_refresh.sh|scripts/package*|scripts/deploy*|scripts/release*|templates/auto-merge.yml|templates/main-ruleset.json|migrations/*|*/migrations/*|*Migration*|*.xcdatamodeld/*|*.entitlements)
                echo "Control-plane path requires an independent merge decision: $path"
                exit 0
                ;;
            esac
          done <<<"$changed_files"

          current_base="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          run_base="$(jq -r '.pull_requests[0].base.sha // empty' <<<"$run_json")"
          tested_event="$(jq -r '.event' <<<"$run_json")"
          fresh=false
          if [[ "$tested_event" == pull_request && "$run_base" == "$current_base" ]]; then
            fresh=true
          elif [[ "$tested_event" == workflow_dispatch ]]; then
            compare_status="$(gh api "repos/$REPOSITORY/compare/$current_base...$head_sha" --jq '.status')"
            if [[ "$compare_status" == ahead || "$compare_status" == identical ]]; then
              fresh=true
            fi
          fi

          if [[ "$fresh" != true ]]; then
            echo 'main advanced after this candidate was tested; updating the branch and dispatching CI once.'
            gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/update-branch" \
              -f expected_head_sha="$head_sha" >/dev/null

            updated_head="$head_sha"
            for _ in {1..30}; do
              updated_head="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
              [[ "$updated_head" != "$head_sha" ]] && break
              sleep 2
            done
            if [[ "$updated_head" == "$head_sha" ]]; then
              echo 'Timed out waiting for the updated PR head; no CI dispatch.'
              exit 1
            fi
            updated_status="$(gh api "repos/$REPOSITORY/compare/$current_base...$updated_head" --jq '.status')"
            if [[ "$updated_status" != ahead && "$updated_status" != identical ]]; then
              echo 'Updated PR head is not based on the current main branch; no CI dispatch.'
              exit 1
            fi

            gh workflow run ci.yml --repo "$REPOSITORY" --ref "$head_ref" \
              -f devflow_post_merge=false -f devflow_platform="$post_merge_platform" \
              -f devflow_full_reason=base-changed-after-candidate \
              -f devflow_expected_head_sha="$updated_head"
            exit 0
          fi

          latest_base="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$latest_base" != "$current_base" ]]; then
            echo 'main changed during the decision; leaving the PR for a fresh run.'
            exit 0
          fi

          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch \
            --match-head-commit "$TESTED_HEAD_SHA"
          merged_sha="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.merge_commit_sha // empty')"
          if [[ -z "$merged_sha" ]]; then
            echo 'Merge completed without an observable merge commit SHA; no smoke dispatch.'
            exit 1
          fi
          gh workflow run ci.yml --repo "$REPOSITORY" --ref main \
            -f devflow_post_merge=true -f devflow_platform="$post_merge_platform" \
            -f devflow_full_reason=none -f devflow_post_merge_sha="$merged_sha"
          echo "Merged PR #$pr_number and dispatched post-merge CI for $merged_sha."
